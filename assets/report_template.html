<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: one phone-friendly column (~780px) of story cards, one finding per card; ornamental dividers separate chapters. Theme preset via body class (rose | ink). */
:root {
  --bg: #fbf4f7; --surface: #fffafc; --card: #ffffff; --ink: #2a1b2e; --ink-2: #5e4a63; --ink-3: #8c7a90; --rule: #ecdce5;
  --accent: #c23d78; --gold: #b08a4a; --satin-a: #fde9f1; --satin-b: #efe7fb; --satin-c: #e6f2fb;
  --seq: #c23d78; --r1: #e58ab0; --r2: #d4609a; --r3: #b8417c; --r4: #932f62; --r5: #6c2149; --r0: #d9ccd5;
  --c-organic: #1f9e86; --c-gifted: #d98a2b; --c-affiliate: #2a86c2; --c-paid: #c23d78; --c-collab: #7b62d3;
  --good: #0ca30c; --warn: #fab219;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-latin: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
body.ink { --bg: #f4f6f9; --surface: #fbfcfe; --ink: #121821; --ink-2: #4a5566; --ink-3: #7a8494; --rule: #dde3ea; --accent: #1c5cab; --gold: #8a9bb3;
  --satin-a: #e5eefb; --satin-b: #eef1f6; --satin-c: #e3f3ee; --seq: #2a78d6; --r1: #86b6ef; --r2: #5598e7; --r3: #2a78d6; --r4: #1c5cab; --r5: #104281; --r0: #c9ced6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1219; --surface: #211823; --card: #271c2a; --ink: #f6ecf2; --ink-2: #d2bfcb; --ink-3: #a592a0; --rule: #3a2b3b;
    --accent: #e17aa6; --gold: #cfae74; --satin-a: #3a1f30; --satin-b: #2c2440; --satin-c: #1d2c3a;
    --seq: #d4558b; --r1: #8e3765; --r2: #b2487f; --r3: #d0639a; --r4: #e48ab2; --r5: #f3b4cf; --r0: #4a3a48;
    --c-organic: #22a88e; --c-gifted: #b5792a; --c-affiliate: #3b93d1; --c-paid: #d4558b; --c-collab: #9283e6;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) body.ink { --bg: #111317; --surface: #191c21; --card: #1e2229; --ink: #eceef2; --ink-2: #b2b9c5; --ink-3: #868e9b; --rule: #2c3038;
    --accent: #6da7ec; --gold: #6b7a90; --satin-a: #1b2a40; --satin-b: #1b1f27; --satin-c: #16302a; --seq: #3987e5;
    --r1: #9ec5f4; --r2: #6da7ec; --r3: #3987e5; --r4: #256abf; --r5: #184f95; --r0: #4a505b; }
}
:root[data-theme="dark"] {
  --bg: #1a1219; --surface: #211823; --card: #271c2a; --ink: #f6ecf2; --ink-2: #d2bfcb; --ink-3: #a592a0; --rule: #3a2b3b;
  --accent: #e17aa6; --gold: #cfae74; --satin-a: #3a1f30; --satin-b: #2c2440; --satin-c: #1d2c3a;
  --seq: #d4558b; --r1: #8e3765; --r2: #b2487f; --r3: #d0639a; --r4: #e48ab2; --r5: #f3b4cf; --r0: #4a3a48;
  --c-organic: #22a88e; --c-gifted: #b5792a; --c-affiliate: #3b93d1; --c-paid: #d4558b; --c-collab: #9283e6;
  color-scheme: dark;
}
:root[data-theme="dark"] body.ink { --bg: #111317; --surface: #191c21; --card: #1e2229; --ink: #eceef2; --ink-2: #b2b9c5; --ink-3: #868e9b; --rule: #2c3038;
  --accent: #6da7ec; --gold: #6b7a90; --satin-a: #1b2a40; --satin-b: #1b1f27; --satin-c: #16302a; --seq: #3987e5;
  --r1: #9ec5f4; --r2: #6da7ec; --r3: #3987e5; --r4: #256abf; --r5: #184f95; --r0: #4a505b; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.75; }
.wrap { max-width: 780px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; display: grid; gap: 28px; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(32px, 7.6vw, 54px); line-height: 1.14; }
h2 { font-family: var(--f-display); font-weight: 900; font-size: clamp(23px, 5.2vw, 32px); line-height: 1.28; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-family: var(--f-data); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--ink-3); line-height: 1.6; }
.card { background: var(--card); border-radius: 22px; padding: clamp(20px, 5vw, 34px); display: grid; gap: 18px; min-width: 0; box-shadow: 0 1px 0 var(--rule), 0 12px 32px -24px rgba(60, 30, 60, .35); }
.card.satin { background: radial-gradient(120% 90% at 0% 0%, var(--satin-a), transparent 60%), radial-gradient(120% 90% at 100% 100%, var(--satin-c), transparent 55%), var(--satin-b); }
.chapter { display: grid; gap: 6px; padding-top: 18px; }
.lace { height: 14px; background: radial-gradient(circle at 7px -1px, transparent 7px, var(--gold) 7.5px, var(--gold) 8.5px, transparent 9px) repeat-x; background-size: 14px 14px; opacity: .55; }
.verdict { font-family: var(--f-display); font-weight: 600; font-size: clamp(18px, 4.2vw, 22px); color: var(--ink-2); }
.archetype { display: inline-flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.archetype b { font-family: var(--f-display); font-size: 20px; color: var(--accent); }
.archetype span { color: var(--ink-2); font-size: 14px; }
.dots { width: 100%; height: auto; display: block; }
.dots circle { cursor: pointer; }
.dots circle:hover { stroke: var(--ink); stroke-width: 1.4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.sq { border-radius: 3px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .stats { grid-template-columns: 1fr; } }
.stat { border-radius: 18px; padding: 18px 20px; background: var(--surface); display: grid; gap: 4px; align-content: start; border: 1px solid var(--rule); }
.stat .big { font-family: var(--f-latin); font-weight: 600; font-size: clamp(42px, 10.5vw, 62px); line-height: 1; font-variant-numeric: lining-nums; }
.stat .big small { font-family: var(--f-body); font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.stat p { color: var(--ink-2); font-size: 14px; }
.stat.hl { background: var(--ink); border-color: var(--ink); }
.stat.hl .big, .stat.hl p, .stat.hl .big small { color: var(--bg); }
.summary { display: grid; gap: 0; }
.sumrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.sumrow:last-child { border-bottom: 0; }
.sumrow .f { font-weight: 700; }
.sumrow .s { color: var(--ink-2); }
.sumrow .s::before { content: "所以呢 → "; color: var(--accent); font-weight: 700; }
@media (max-width: 600px) { .sumrow { grid-template-columns: 1fr; gap: 6px; } }
.mix { display: grid; gap: 14px; }
.mixrow { display: grid; grid-template-columns: 6.2em 1fr; gap: 12px; align-items: center; font-size: 14px; }
.stack { display: flex; height: 30px; gap: 2px; min-width: 0; }
.seg { height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--f-data); font-size: 12px; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
.seg:first-child { border-radius: 8px 0 0 8px; }
.seg:last-child { border-radius: 0 8px 8px 0; }
.seg:only-child { border-radius: 8px; }
.seg.light { color: #2a1022; }
.mixrow .sub { grid-column: 2; font-size: 12px; color: var(--ink-3); margin-top: -8px; }
.mult { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 680px) { .mult { grid-template-columns: 1fr; } }
.mc h3 { margin-bottom: 10px; }
.hb { display: grid; grid-template-columns: 5.4em 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
.hb .lab { color: var(--ink-2); display: flex; align-items: center; }
.track { position: relative; height: 24px; min-width: 0; }
.grid-x { position: absolute; inset: 0; pointer-events: none; }
.grid-x i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rule); }
.bar { position: absolute; left: 0; top: 5px; height: 14px; border-radius: 0 4px 4px 0; }
.bar-v { position: absolute; top: 1px; font-family: var(--f-data); font-size: 12px; color: var(--ink); white-space: nowrap; }
.ticks { grid-column: 2; position: relative; height: 16px; font-family: var(--f-data); font-size: 11px; color: var(--ink-3); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.tier-rows { display: grid; grid-template-columns: 11.5em 1fr 3.6em; gap: 10px 12px; align-items: center; font-size: 13px; }
@media (max-width: 520px) { .tier-rows { grid-template-columns: 1fr 3.6em; } .tier-rows > .tl { grid-column: 1 / -1; margin-bottom: -6px; } }
.rank { display: grid; grid-template-columns: minmax(0, 15em) 1fr; gap: 10px 12px; align-items: center; font-size: 14px; }
.rank .name { min-width: 0; }
.heat { border-collapse: separate; border-spacing: 3px; }
.heat td, .heat th { border: 0; }
.heat td.c { text-align: center; font-family: var(--f-data); font-size: 13px; min-width: 5.2em; border-radius: 6px; }
.heat td.c small { display: block; font-size: 11px; color: var(--ink-3); line-height: 1.2; }
.heat td.c.dk { color: #fff; }
.heat td.c.dk small { color: rgba(255,255,255,.8); }
.tscroll { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--ink-3); font-size: 12px; white-space: nowrap; }
td.r, th.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tr.me td { background: color-mix(in oklab, var(--accent) 10%, transparent); font-weight: 600; }
.pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; color: #fff; }
.pill.role { background: var(--ink); color: var(--bg); }
.actions { display: grid; gap: 14px; }
.action { display: grid; gap: 8px; padding: 18px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--rule); }
.action .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.action .type { font-family: var(--f-display); font-weight: 900; font-size: 15px; padding: 2px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); }
.action h3 { font-family: var(--f-display); font-size: 18px; }
.action p { color: var(--ink-2); font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-3); }
.meta b { color: var(--ink); font-weight: 600; }
.bullets { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; color: var(--ink-2); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab, .chip { font: inherit; font-size: 13px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.tab[aria-selected="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters input, .filters select { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--ink); }
.filters input { min-width: 0; flex: 1 1 150px; max-width: 240px; }
.list td { font-size: 13px; }
.list td.txt { color: var(--ink-2); min-width: 16em; max-width: 28em; }
.more { justify-self: start; font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; max-width: 280px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
</style>

<div class="wrap" id="app"></div>
<div id="tip" hidden></div>

<script>
const D = __DATA__;
const N = __NARRATIVE__;
document.body.classList.add(N.theme === 'ink' ? 'ink' : 'rose');
const CATS = ['organic', 'gifted', 'affiliate', 'paid', 'collab'];
const CN = { organic: '自然内容', gifted: '寄样（PR）', affiliate: '联盟带货', paid: '付费合作', collab: '品牌合作（未注明）' };
const SHORT = { organic: '自然', gifted: '寄样', affiliate: '联盟', paid: '付费', collab: '品牌合作' };
const CC = Object.fromEntries(CATS.map(c => [c, `var(--c-${c})`]));
const PL = ['TikTok', 'Instagram', 'YouTube', '小红书'].filter(p => D.plat[p]);
const H = N.headlines || {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n == null ? '–' : n >= 1e4 ? (n / 1e4).toFixed(n >= 1e5 ? 1 : 2).replace(/\.?0+$/, '') + ' 万' : Math.round(n).toLocaleString('en-US');
const pctf = x => x == null ? '–' : (x * 100).toFixed(x < 0.1 ? 1 : 0) + '%';
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const K = D.kpi;
let html = '';
const chap = (i, eb, h) => `<section class="chapter"><div class="eyebrow">${String(i).padStart(2, '0')} · ${esc(eb)}</div><h2>${esc(h)}</h2></section>`;
let ci = 0;

// cover
html += `<section class="card satin">
  <div class="eyebrow">竞品红人打法拆解 · ${esc(D.window)} · ${PL.join(' / ')}</div>
  <h1>${esc(N.brand_display || D.brand)}<br>${esc(N.title_suffix || '红人营销打法拆解')}</h1>
  <p class="verdict">${esc(N.verdict)}</p>
  <div class="archetype"><b>${esc(K.archetype)}</b><span>${esc(K.archetype_reason)}</span></div>
  <svg class="dots" id="dots" role="img" aria-label="内容点阵：每个圆点是一条提到该品牌的内容，颜色表示内容类型"></svg>
  <div class="legend">${CATS.filter(c => K.bycat[c]).map(c => `<span><i class="sw" style="background:${CC[c]}"></i>${CN[c]} <b class="num">${K.bycat[c]}</b></span>`).join('')}</div>
  <p class="note">每个圆点 = 1 条提到 ${esc(D.brand)} 的内容，按类型排列。悬停查看博主，点击打开原帖。</p>
</section>`;

// stats
const tt = D.plat.TikTok;
const ratio = K.brandled_vs_organic_views;
html += `<div class="stats">
  <div class="stat"><div class="big">${K.total}<small>条内容</small></div><p>来自 ${K.creators} 位博主（${PL.join('、')}），搜索抽样，规模为下限。</p></div>
  <div class="stat hl"><div class="big">${pctf(K.organic_share)}<small>自然内容</small></div><p>没有付费、寄样、带货信号的用户自发内容。</p></div>
  <div class="stat"><div class="big">${K.bycat.paid || 0}<small>条付费合作</small></div><p>占 ${pctf(K.paid_share)}；寄样 ${K.bycat.gifted || 0} 条，联盟带货 ${K.bycat.affiliate || 0} 条。</p></div>
  <div class="stat"><div class="big">${ratio ? (ratio >= 10 ? ratio.toFixed(0) : ratio.toFixed(1)) + '×' : '–'}</div><p>TikTok 品牌主导内容的播放中位数${tt ? `（${fmt(tt.views_brandled[0])}）` : ''}是自然内容${tt ? `（${fmt(tt.views.organic[0])}）` : ''}的倍数。≥5 说明声量靠买。</p></div>
</div>`;

// summary
html += `<div class="lace" aria-hidden="true"></div>` + chap(++ci, '执行摘要', H.summary || '结论先行') +
  `<section class="card"><div class="summary">${(N.summary || []).map(s => `<div class="sumrow"><div class="f">${esc(s.finding)}</div><div class="s">${esc(s.sowhat)}</div></div>`).join('')}</div>
  ${D.decision_question ? `<p class="note">本次调研要回答的问题：${esc(D.decision_question)}</p>` : ''}</section>`;

// benchmark
const B = [...(D.benchmarks || []), D.me];
html += chap(++ci, '对标定位', H.benchmark || '和对标品牌比，它处在什么位置') + `<section class="card tscroll"><table>
  <thead><tr><th>品牌</th><th>打法</th><th class="r">自然</th><th class="r">付费</th><th class="r">寄样</th><th class="r">联盟</th><th class="r">品牌主导/自然播放</th><th class="r">商业博主粉丝中位数</th><th class="r">官网社交流量</th></tr></thead>
  <tbody>${B.map(b => `<tr class="${b === D.me ? 'me' : ''}"><td>${esc(b.brand)}</td><td>${esc(b.archetype)}</td><td class="r num">${pctf(b.organic_share)}</td><td class="r num">${pctf(b.paid_share)}</td><td class="r num">${pctf(b.gifted_share)}</td><td class="r num">${pctf(b.affiliate_share)}</td><td class="r num">${b.brandled_vs_organic_views ? b.brandled_vs_organic_views.toFixed(1) + '×' : '–'}</td><td class="r num">${fmt(b.commercial_follower_median)}</td><td class="r num">${pctf(b.social_traffic_share)}</td></tr>`).join('')}</tbody></table>
  <p class="note">对标库随每次调研累积。早期品牌的口径可能略有不同，见各自备注。</p></section>`;

// mix
html += `<div class="lace" aria-hidden="true"></div>` + chap(++ci, '内容构成', H.mix || '内容构成') + `<section class="card">
  <div class="legend">${CATS.map(c => `<span><i class="sw sq" style="background:${CC[c]}"></i>${CN[c]}</span>`).join('')}</div>
  <div class="mix">${PL.map(p => { const d = D.plat[p], n = d.total; return `<div class="mixrow"><b>${p}</b><div class="stack">` +
    CATS.map(c => d.bycat[c] ? `<div class="seg" data-t="${esc(`${p} · ${CN[c]}<br><b>${d.bycat[c]}</b> 条（${pct(d.bycat[c], n)}%）`)}" style="flex:${d.bycat[c]};background:${CC[c]}">${pct(d.bycat[c], n) >= 8 ? pct(d.bycat[c], n) + '%' : ''}</div>` : '').join('') +
    `</div><div class="sub">${n} 条内容 · ${d.creators} 位博主 · 商业博主人均 ${d.per_creator_commercial} 条</div></div>`; }).join('')}</div>
  <p class="note">付费合作 = #ad / sponsored / 平台付费合作标记；寄样 = PR、gifted、感谢品牌寄送；联盟带货 = TikTok Shop、折扣码、零售链接；品牌合作（未注明）= 只有平台商业披露标记。</p></section>`;

// views
const lo = 2, hi = 6, x = v => (Math.log10(Math.max(v, 100)) - lo) / (hi - lo) * 100;
const grid = `<div class="grid-x">${[100, 1e3, 1e4, 1e5, 1e6].map(t => `<i style="left:${x(t)}%"></i>`).join('')}</div>`;
html += chap(++ci, '播放量', H.views || '播放量') + `<section class="card"><div class="mult">${PL.map(p => { const d = D.plat[p];
  if (!CATS.some(c => d.views[c][1] > 0)) return `<div class="mc"><h3>${p}</h3><p class="note">该平台接口没有返回播放数据，用点赞衡量互动。</p></div>`;
  return `<div class="mc"><h3>${p}</h3><div class="hb">` + CATS.filter(c => d.views[c][1] > 0).map(c => { const [v, n] = d.views[c], w = x(v);
    const lab = w > 72 ? `right:${100 - w + 1.5}%;color:#fff` : `left:calc(${w}% + 6px)`;
    return `<div class="lab"><i class="sw" style="background:${CC[c]}"></i>${SHORT[c]}</div><div class="track">${grid}<div class="bar" data-t="${esc(`${p} · ${CN[c]}<br>播放中位数 <b>${fmt(v)}</b><br>样本 ${n} 条`)}" style="width:${w}%;background:${CC[c]}"></div><span class="bar-v" style="${lab}">${fmt(v)}</span></div>`; }).join('') +
    `<div class="ticks"><span style="left:0%">100</span><span style="left:50%">1万</span><span style="left:100%">100万</span></div></div></div>`; }).join('')}</div>
  <p class="note">播放量中位数，三个面板共用对数刻度。IG 只有部分 Reels 带播放数据，样本少时仅作参考（悬停看样本量）。</p></section>`;

// tiers
const T = D.tiers, TC = ['var(--r1)', 'var(--r2)', 'var(--r3)', 'var(--r4)', 'var(--r5)', 'var(--r0)'], LT = [true, false, false, false, false, true];
html += chap(++ci, '博主量级', H.tiers || '博主量级') + `<section class="card">
  <div class="legend">${T.map((t, i) => `<span><i class="sw sq" style="background:${TC[i]}"></i>${esc(t)}</span>`).join('')}</div>
  <div class="tier-rows">${PL.map(p => [['tiers_comm', '商业内容'], ['tiers_org', '自然内容']].map(([k, lab]) => { const t = D.plat[p][k], n = T.reduce((s, z) => s + (t[z] || 0), 0);
    return `<div class="tl"><b>${p}</b> · ${lab}</div><div class="stack">` + T.map((z, i) => t[z] ? `<div class="seg${LT[i] ? ' light' : ''}" data-t="${esc(`${p} · ${lab}<br>${z}：<b>${t[z]}</b> 人（${pct(t[z], n)}%）`)}" style="flex:${t[z]};background:${TC[i]}">${pct(t[z], n) >= 10 ? pct(t[z], n) + '%' : ''}</div>` : '').join('') + `</div><div class="num" style="text-align:right;color:var(--ink-2)">${n} 人</div>`; }).join('')).join('')}</div>
  <p class="note">按博主人数统计；商业内容 = 寄样、联盟、付费、品牌合作。</p></section>`;

// products
const prodTot = (D.products || []).map(s => [s, PL.reduce((a, p) => a + (D.plat[p].products[s] || 0), 0), PL.map(p => D.plat[p].products[s] || 0)]).filter(s => s[1] > 0).sort((a, b) => b[1] - a[1]);
if (prodTot.length) {
  const mx = prodTot[0][1];
  html += `<div class="lace" aria-hidden="true"></div>` + chap(++ci, '产品 / 系列', H.products || '哪些产品被讨论最多') + `<section class="card"><div class="rank">${prodTot.map(([s, n, parts]) => { const w = n / mx * 100, lab = w > 80 ? `right:${100 - w + 1.5}%;color:#fff` : `left:calc(${w}% + 6px)`;
    return `<div class="name">${esc(s)}</div><div class="track"><div class="bar" data-t="${esc(`${s}<br>${PL.map((p, i) => p + ' ' + parts[i]).join(' · ')}`)}" style="width:${w}%;background:var(--seq)"></div><span class="bar-v" style="${lab}">${n}</span></div>`; }).join('')}</div>
    <p class="note">各平台合计提及次数，一条内容可提及多个。</p></section>`;
}

// heatmaps
function heat(keys, field) {
  const vals = keys.map(k => PL.map(p => pct(D.plat[p][field][k] || 0, D.plat[p].total)));
  const order = keys.map((k, i) => [k, vals[i], vals[i].reduce((a, b) => a + b, 0)]).filter(o => o[2] > 0).sort((a, b) => b[2] - a[2]);
  return `<table class="heat"><thead><tr><th></th>${PL.map(p => `<th style="text-align:center">${p}</th>`).join('')}</tr></thead><tbody>` +
    order.map(([k, v]) => `<tr><td>${esc(k)}</td>${v.map((z, j) => { const n = D.plat[PL[j]][field][k] || 0, a = Math.round(Math.min(z, 50) / 50 * 85);
      return `<td class="c${a >= 50 ? ' dk' : ''}" style="background:color-mix(in oklab, var(--seq) ${a}%, var(--surface))">${z}%<small>${n} 条</small></td>`; }).join('')}</tr>`).join('') + `</tbody></table>`;
}
html += chap(++ci, '主打内容', H.themes || '内容怎么拍') + `<section class="card tscroll">${heat(D.themes, 'themes')}<p class="note">单元格 = 命中该主题的内容占本平台内容的比例。</p></section>`;
html += chap(++ci, '主打卖点', H.points || '大家在夸什么') + `<section class="card tscroll">${heat(D.points, 'points')}<p class="note">口径同上。</p></section>`;

// channels
const agg = {}; PL.forEach(p => D.plat[p].channels.forEach(([k, n]) => { agg[k] = (agg[k] || 0) + n; }));
const ce = Object.entries(agg).sort((a, b) => b[1] - a[1]);
html += `<div class="lace" aria-hidden="true"></div>` + chap(++ci, '转化渠道', H.channels || '在哪里成交');
if (ce.length) { const mx = ce[0][1];
  html += `<section class="card"><h3>商业内容指向的购买渠道</h3><div class="rank">${ce.map(([k, n]) => { const w = n / mx * 100, lab = w > 80 ? `right:${100 - w + 1.5}%;color:#fff` : `left:calc(${w}% + 6px)`;
    return `<div class="name">${esc(k)}</div><div class="track"><div class="bar" style="width:${w}%;background:var(--c-affiliate)"></div><span class="bar-v" style="${lab}">${n} 条</span></div>`; }).join('')}</div></section>`; }
if (D.traffic && D.traffic.sources) {
  const names = { direct: '直接访问', searchOrganic: '自然搜索', searchPaid: '付费搜索', referrals: '引荐', mail: '邮件', socialOrganic: '社交（自然）', genAi: 'AI 聊天机器人', displayAds: '展示广告', socialPaid: '社交（付费）', affiliate: '联盟' };
  const t = Object.entries(D.traffic.sources).sort((a, b) => b[1] - a[1]), tm = t[0][1];
  html += `<section class="card"><h3>官网流量来源（Similarweb）</h3><div class="hb" style="grid-template-columns:7.5em 1fr">${t.map(([k, v]) => { const w = v / tm * 100, lab = w > 80 ? `right:${100 - w + 1.5}%;color:#fff` : `left:calc(${w}% + 6px)`;
    return `<div class="lab">${names[k] || k}</div><div class="track"><div class="bar" style="width:${Math.max(w, .6)}%;background:var(--seq)"></div><span class="bar-v" style="${lab}">${(v * 100).toFixed(1)}%</span></div>`; }).join('')}</div>
    <p class="note">月访问约 ${fmt(D.traffic.monthly)}；国家：${(D.traffic.countries || []).map(([n, s]) => `${esc(n)} ${(s * 100).toFixed(0)}%`).join('、')}。</p></section>`;
}
if ((N.channels || []).length) html += `<section class="card tscroll"><table><thead><tr><th>渠道</th><th>地位</th><th>证据</th></tr></thead><tbody>${N.channels.map(c => `<tr><td><b>${esc(c.name)}</b></td><td><span class="pill role">${esc(c.role)}</span></td><td>${esc(c.evidence)}</td></tr>`).join('')}</tbody></table>
  ${(N.scale_notes || []).length ? `<p class="note">规模参考（口径不一）：${N.scale_notes.map(esc).join(' ')}</p>` : ''}</section>`;

// actions
html += `<div class="lace" aria-hidden="true"></div>` + chap(++ci, '建议动作', H.actions || '我们该怎么做') + `<section class="card"><div class="actions">${(N.actions || []).map(a => `<div class="action">
  <div class="top"><span class="type">${esc(a.type)}</span><h3>${esc(a.title)}</h3></div><p>${esc(a.detail)}</p>
  <div class="meta"><span>优先级 <b>${esc(a.priority)}</b></span><span>预算 <b>${esc(a.budget)}</b></span><span>怎么验证 <b>${esc(a.measure)}</b></span></div></div>`).join('')}</div></section>`;

// top + list + method
html += chap(++ci, '案例', '播放量最高的内容') + `<div class="tabs" role="tablist" id="top-tabs"></div><section class="card tscroll"><table id="top"></table></section>`;
html += chap(++ci, '明细', '全部内容清单') + `<div class="filters"><div class="tabs" id="f-plat"></div><select id="f-cat" aria-label="内容类型"></select>
  <select id="f-sort" aria-label="排序"><option value="v">按播放量</option><option value="f">按粉丝数</option><option value="ts">按发布时间</option></select>
  <input id="f-q" type="search" placeholder="搜索博主或文案" aria-label="搜索博主或文案"></div>
  <section class="card tscroll"><table class="list" id="list"></table></section><button class="more" id="more" type="button"></button>`;
html += `<section class="chapter"><div class="eyebrow">方法</div><h2>口径与局限</h2></section><section class="card"><ul class="bullets">
  <li>样本是搜索抽样，不是全量：${PL.map(p => `${p} ${D.plat[p].total} 条`).join('、')}。没有披露的合作会被算进自然内容，付费规模视为下限。</li>
  <li>分类优先看文案（#ad / PR / 折扣码 / 零售链接），平台标记兜底；YouTube 只看标题和简介中提到品牌的行。已剔除官方号、仿冒号、同名噪音和竞品赞助内容。</li>
  ${D.coverage && Object.keys(D.coverage.sources || {}).some(s => s !== 'tikhub') ? `<li>部分数据来自免费兜底工具（${Object.entries(D.coverage.sources).map(([s, n]) => `${esc(s)} ${n} 条`).join('、')}）：${D.coverage.no_date ? `${D.coverage.no_date} 条没有发布日期、未按时间窗过滤；` : ''}缺粉丝数的内容在量级统计中记为"未知"。</li>` : ''}
  ${(N.method_notes || []).map(m => `<li>${esc(m)}</li>`).join('')}
  ${(N.sources || []).length ? `<li>来源：${N.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('、')}</li>` : ''}
</ul></section>`;
document.getElementById('app').innerHTML = html;

// interactions
const tip = document.getElementById('tip');
function bindTip(el, h) {
  el.addEventListener('mousemove', e => { tip.innerHTML = h; tip.hidden = false; const r = tip.getBoundingClientRect();
    let px = e.clientX + 14, py = e.clientY + 14; if (px + r.width > innerWidth - 8) px = e.clientX - r.width - 14; if (py + r.height > innerHeight - 8) py = e.clientY - r.height - 14;
    tip.style.left = Math.max(8, px) + 'px'; tip.style.top = Math.max(8, py) + 'px'; });
  el.addEventListener('mouseleave', () => { tip.hidden = true; });
}
document.querySelectorAll('[data-t]').forEach(el => bindTip(el, el.dataset.t));
(function () {
  const rows = [...D.rows].sort((a, b) => CATS.indexOf(a.c) - CATS.indexOf(b.c) || (b.v || 0) - (a.v || 0));
  const cols = 40, g = 18, W = cols * g, Hh = Math.ceil(rows.length / cols) * g, svg = document.getElementById('dots');
  svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
  svg.innerHTML = rows.map((d, i) => `<circle data-i="${i}" cx="${(i % cols) * g + g / 2}" cy="${Math.floor(i / cols) * g + g / 2}" r="6.2" fill="${CC[d.c]}"/>`).join('');
  svg.querySelectorAll('circle').forEach(el => { const d = rows[+el.dataset.i];
    bindTip(el, `<b>${esc(d.h)}</b> · ${d.p}<br>${CN[d.c]}${d.ch ? ' · ' + esc(d.ch) : ''}<br>播放 ${fmt(d.v)} · 粉丝 ${fmt(d.f)}`);
    el.addEventListener('click', () => { if (d.u) window.open(d.u, '_blank', 'noopener'); }); });
})();
(function () {
  const tabs = document.getElementById('top-tabs');
  tabs.innerHTML = PL.map((p, i) => `<button class="tab" role="tab" type="button" aria-selected="${i === 0}" data-k="${p}">${p}</button>`).join('');
  const render = k => { const rows = D.rows.filter(r => r.p === k && r.v != null).sort((a, b) => b.v - a.v).slice(0, 8);
    document.getElementById('top').innerHTML = `<thead><tr><th>博主</th><th class="r">粉丝</th><th class="r">播放</th><th>类型</th><th>内容</th></tr></thead><tbody>` +
      rows.map(r => `<tr><td><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.h)}</a></td><td class="r num">${fmt(r.f)}</td><td class="r num">${fmt(r.v)}</td><td><span class="pill" style="background:${CC[r.c]}">${SHORT[r.c]}</span></td><td style="color:var(--ink-2);min-width:15em">${esc(r.t.slice(0, 80))}</td></tr>`).join('') + `</tbody>`; };
  tabs.addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; tabs.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t === b)); render(b.dataset.k); });
  if (PL.length) render(PL[0]);
})();
(function () {
  const LN = { en: '英语', ja: '日语', ko: '韩语', ru: '俄语', vi: '越南语', es: '西语', pt: '葡语', fr: '法语', de: '德语', it: '意语', th: '泰语', zh: '中文', hi: '印地语', 'id/ms': '印尼/马来语' };
  const st = { p: '', c: '', s: 'v', q: '', all: false }, fp = document.getElementById('f-plat'), fc = document.getElementById('f-cat');
  fp.innerHTML = [['', '全部'], ...PL.map(p => [p, p])].map(([k, l]) => `<button class="chip" type="button" aria-pressed="${k === ''}" data-k="${k}">${l}</button>`).join('');
  fc.innerHTML = `<option value="">全部类型</option>` + CATS.map(c => `<option value="${c}">${CN[c]}</option>`).join('');
  fp.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; fp.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b)); st.p = b.dataset.k; render(); });
  fc.addEventListener('change', e => { st.c = e.target.value; render(); });
  document.getElementById('f-sort').addEventListener('change', e => { st.s = e.target.value; render(); });
  document.getElementById('f-q').addEventListener('input', e => { st.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById('more').addEventListener('click', () => { st.all = !st.all; render(); });
  function render() {
    const rows = D.rows.filter(r => (!st.p || r.p === st.p) && (!st.c || r.c === st.c) && (!st.q || ((r.h || '') + ' ' + r.t).toLowerCase().includes(st.q)));
    rows.sort((a, b) => (b[st.s] ?? -1) - (a[st.s] ?? -1));
    const shown = st.all ? rows : rows.slice(0, 25);
    document.getElementById('list').innerHTML = `<thead><tr><th>平台</th><th>博主</th><th class="r">粉丝</th><th>类型</th><th>渠道</th><th class="r">播放</th><th>语言</th><th>日期</th><th>内容摘要</th></tr></thead><tbody>` +
      (shown.length ? shown.map(r => `<tr><td>${r.p}</td><td><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.h)}</a></td><td class="r num">${fmt(r.f)}</td><td><span class="pill" style="background:${CC[r.c]}">${SHORT[r.c]}</span></td><td style="white-space:nowrap">${esc(r.ch) || '–'}</td><td class="r num">${fmt(r.v)}</td><td style="white-space:nowrap">${LN[r.lang] || r.lang}</td><td class="num" style="white-space:nowrap">${r.ts ? new Date(r.ts * 1000).toISOString().slice(5, 10) : '–'}</td><td class="txt">${esc(r.t)}</td></tr>`).join('')
        : `<tr><td colspan="9" style="color:var(--ink-3)">没有符合条件的内容，换个筛选条件试试。</td></tr>`) + `</tbody>`;
    const m = document.getElementById('more'); m.hidden = rows.length <= 25; m.textContent = st.all ? '收起' : `显示全部 ${rows.length} 条`;
  }
  render();
})();
</script>
